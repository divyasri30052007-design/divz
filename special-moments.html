<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Special Moments ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial, sans-serif;

    background:
        radial-gradient(circle at 20% 20%, #ffd6e5 0%, transparent 30%),
        radial-gradient(circle at 80% 80%, #e8b5cc 0%, transparent 35%),
        linear-gradient(135deg,#fff1f6,#f5c8da,#df9fbb);

    position:relative;
}


/* BACKGROUND HEARTS */

.heart{
    position:absolute;
    color:rgba(255,255,255,0.65);
    font-size:28px;
    animation:float 8s linear infinite;
}

.h1{left:8%;bottom:-50px;animation-delay:0s;}
.h2{left:20%;bottom:-50px;animation-delay:2s;}
.h3{left:35%;bottom:-50px;animation-delay:4s;}
.h4{left:55%;bottom:-50px;animation-delay:1s;}
.h5{left:72%;bottom:-50px;animation-delay:3s;}
.h6{left:88%;bottom:-50px;animation-delay:5s;}

@keyframes float{

    0%{
        transform:translateY(0) rotate(0deg);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        transform:translateY(-110vh) rotate(180deg);
        opacity:0;
    }
}


/* TITLE */

.title{
    position:absolute;
    top:25px;

    text-align:center;

    color:#633449;

    z-index:5;
}

.title small{
    letter-spacing:4px;
    font-size:9px;
}

.title h1{
    font-family:Georgia,serif;
    font-size:32px;
    font-weight:normal;
    margin-top:6px;
}

.line{
    width:45px;
    height:2px;
    background:#a95677;
    margin:8px auto;
}


/* PHONE */

.phone{

    width:370px;
    height:640px;

    background:#f8edf1;

    border:7px solid #241c20;

    border-radius:40px;

    overflow:hidden;

    position:relative;

    z-index:10;

    box-shadow:
        0 30px 70px rgba(91,40,65,.4),
        0 10px 20px rgba(0,0,0,.2);
}


/* PHONE TOP */

.notch{

    position:absolute;

    top:0;
    left:50%;

    transform:translateX(-50%);

    width:85px;
    height:20px;

    background:#241c20;

    border-radius:0 0 14px 14px;

    z-index:20;
}


/* HEADER */

.header{

    height:70px;

    background:linear-gradient(
        135deg,
        #a64e70,
        #75354f
    );

    color:white;

    display:flex;
    align-items:center;

    padding:10px;

    gap:10px;
}

.back{
    font-size:34px;
}

.profile{
    flex:1;

    display:flex;
    align-items:center;

    gap:10px;
}

.avatar{

    width:43px;
    height:43px;

    border-radius:50%;

    background:#ffd7e5;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#a44367;

    font-size:22px;
}

.name{
    font-size:13px;
    font-weight:bold;
}

.online{
    font-size:10px;
    opacity:.75;
    margin-top:3px;
}

.more{
    letter-spacing:3px;
}


/* CHAT */

.chat{

    height:calc(100% - 123px);

    overflow-y:auto;

    padding:18px 13px;

    background:#f8edf1;

    scroll-behavior:smooth;
}


/* DATE */

.date{

    text-align:center;

    margin-bottom:18px;
}

.date span{

    background:#ead2dc;

    color:#765362;

    padding:6px 12px;

    border-radius:15px;

    font-size:9px;
}


/* MESSAGE */

.message{

    max-width:78%;

    padding:9px 12px;

    margin:8px 0;

    font-size:12px;

    line-height:1.5;

    color:#4d3741;

    animation:appear .5s ease;
}

.left{

    background:white;

    margin-right:auto;

    border-radius:4px 15px 15px 15px;

    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.right{

    background:#f3c2d4;

    margin-left:auto;

    border-radius:15px 4px 15px 15px;

    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.time{

    display:block;

    text-align:right;

    font-size:8px;

    color:#997a86;

    margin-top:4px;
}

@keyframes appear{

    from{
        opacity:0;
        transform:translateY(12px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* TYPING */

.typing{

    position:absolute;

    bottom:60px;
    left:20px;

    display:none;

    gap:4px;
}

.dot{

    width:5px;
    height:5px;

    background:#a55b78;

    border-radius:50%;

    animation:typing 1s infinite;
}

.dot:nth-child(2){
    animation-delay:.15s;
}

.dot:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{

    50%{
        transform:translateY(-4px);
    }
}


/* BOTTOM */

.bottom{

    position:absolute;

    bottom:0;
    left:0;

    width:100%;
    height:53px;

    display:flex;

    align-items:center;

    gap:7px;

    padding:7px;

    background:#f3e6eb;

    border-top:1px solid #e2ccd5;
}

.input{

    flex:1;

    background:white;

    color:#aa929d;

    padding:10px 14px;

    border-radius:20px;

    font-size:10px;
}

.send{

    width:36px;
    height:36px;

    border:none;

    border-radius:50%;

    background:#8e4563;

    color:white;

    cursor:pointer;

    font-size:16px;
}


/* FINAL CARD */

.special{

    text-align:center;

    margin:20px auto;

    width:90%;

    padding:18px;

    border-radius:18px;

    background:linear-gradient(
        135deg,
        white,
        #ffe0eb
    );

    box-shadow:0 8px 25px rgba(100,40,65,.15);

    animation:appear .8s ease;
}

.special-heart{
    font-size:28px;
}

.special h3{
    font-family:Georgia,serif;

    color:#743b54;

    margin:7px 0;
}

.special p{
    color:#8b6b78;

    font-size:10px;

    line-height:1.6;
}


/* =========================
   LITTLE LETTER
========================= */

.letter{

    width:90%;

    margin:25px auto 35px;

    padding:24px 20px;

    background:
        linear-gradient(
            135deg,
            #fffdfd,
            #ffe4ee
        );

    border:1px solid rgba(169,86,119,.18);

    border-radius:20px;

    box-shadow:
        0 10px 30px rgba(100,40,65,.15);

    text-align:left;

    position:relative;

    animation:letterAppear 1s ease;

    overflow:hidden;
}


/* INNER BORDER */

.letter::before{

    content:"";

    position:absolute;

    top:10px;
    left:10px;
    right:10px;
    bottom:10px;

    border:1px dashed #d9a7ba;

    border-radius:15px;

    pointer-events:none;
}


/* SMALL DECORATIONS */

.letter::after{

    content:"✦  ♡  ✦";

    position:absolute;

    top:14px;
    right:20px;

    color:#d493aa;

    font-size:10px;

    letter-spacing:3px;
}


/* LETTER HEART */

.letter-heart{

    position:relative;

    z-index:2;

    text-align:center;

    font-size:28px;

    margin-bottom:5px;

    animation:heartBeat 1.5s infinite;
}


/* LETTER TITLE */

.letter-title{

    position:relative;

    z-index:2;

    text-align:center;

    font-family:Georgia,serif;

    color:#743b54;

    font-size:21px;

    margin-bottom:17px;
}


/* LETTER CONTENT */

.letter p{

    position:relative;

    z-index:2;

    color:#70515e;

    font-family:Georgia,serif;

    font-size:12px;

    line-height:1.9;

    margin:10px 5px;
}


/* SIGNATURE */

.letter-sign{

    position:relative;

    z-index:2;

    text-align:right;

    font-family:Georgia,serif;

    color:#8e4563;

    font-size:12px;

    margin-top:18px;

    font-style:italic;
}


/* =========================
   CONTINUE BUTTON
========================= */

.next-page{

    display:block;

    margin:22px auto 30px;

    padding:13px 25px;

    border:none;

    border-radius:25px;

    background:
        linear-gradient(
            135deg,
            #8460aa,
            #62417f
        );

    color:white;

    font-size:11px;

    letter-spacing:1px;

    cursor:pointer;

    box-shadow:
        0 8px 20px
        rgba(90,60,125,.25);

    transition:.3s;

    animation:appear .8s ease;
}

.next-page:hover{

    transform:
        translateY(-3px)
        scale(1.03);

    box-shadow:
        0 12px 25px
        rgba(90,60,125,.35);
}


@keyframes letterAppear{

    from{

        opacity:0;

        transform:
            translateY(35px)
            scale(.95);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}


@keyframes heartBeat{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.15);
    }
}


/* MOBILE */

@media(max-width:500px){

    .title{
        display:none;
    }

    .phone{

        width:100vw;
        height:100vh;

        border:none;

        border-radius:0;
    }

    .notch{
        display:none;
    }

}

</style>
</head>


<body>


<!-- BACKGROUND -->

<div class="heart h1">♡</div>
<div class="heart h2">♡</div>
<div class="heart h3">✦</div>
<div class="heart h4">♡</div>
<div class="heart h5">✧</div>
<div class="heart h6">♡</div>


<!-- TITLE -->

<div class="title">

    <small>OUR LITTLE CONVERSATIONS</small>

    <h1>Special Moments</h1>

    <div class="line"></div>

</div>


<!-- PHONE -->

<div class="phone">

    <div class="notch"></div>


    <!-- HEADER -->

    <div class="header">

        <div class="back">‹</div>

        <div class="profile">

            <div class="avatar">♡</div>

            <div>

                <div class="name">
                    My Favourite Person
                </div>

                <div class="online">
                    online • always
                </div>

            </div>

        </div>

        <div class="more">
            •••
        </div>

    </div>


    <!-- CHAT -->

    <div class="chat" id="chat">

        <div class="date">

            <span>
                27 August 2025
            </span>

        </div>

    </div>


    <!-- TYPING -->

    <div class="typing" id="typing">

        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>

    </div>


    <!-- BOTTOM -->

    <div class="bottom">

        <div class="input">
            Type a message...
        </div>

        <button
            class="send"
            onclick="restart()">

            ➤

        </button>

    </div>

</div>


<script>


const chat =
document.getElementById("chat");

const typing =
document.getElementById("typing");


/* MESSAGES */

const messages = [

    ["left",
    "Heyy... ❤️",
    "10:21 PM"],

    ["right",
    "Hii... 👀",
    "10:21 PM"],

    ["left",
    "enaku na nenacha mari ponu kedachuta happy",
    "10:22 PM"],

    ["right",
    "yaru naa dhaney🥹❤️",
    "10:22 PM"],

    ["left",
    " Ama but Neee love la pana vena just feel my love",
    "10:23 PM"],

    ["right",
    " Seri enaiya epdi pathupinga 💗",
    "10:23 PM"],

    ["left",
    "kolandha mari pathupen and un parents ah yum nala pathupen",
    "10:24 PM"],

    ["right",
    "Aahaan✨",
    "10:24 PM"],

    ["right",
    "seri na onu solanum but enaku time um venum..I LOVE YOU🫶",
    "10:25 PM"],

    ["left",
    "LOVE YOU",
    "10:26 PM"],

    ["right",
    "Enaiya vitutu poirathinga ❤️",
    "10:26 PM"]

];


let index = 0;


/* SHOW MESSAGES */

function showMessage(){

    if(index >= messages.length){

        typing.style.display="none";

        setTimeout(showFinal,800);

        return;
    }


    typing.style.display="flex";


    setTimeout(()=>{

        typing.style.display="none";


        const data =
        messages[index];


        const div =
        document.createElement("div");


        div.className =
        "message " + data[0];


        div.innerHTML =

        data[1] +

        `<span class="time">
        ${data[2]}
        </span>`;


        chat.appendChild(div);


        chat.scrollTo({

            top:chat.scrollHeight,

            behavior:"smooth"

        });


        index++;


        setTimeout(showMessage,900);


    },1000);

}


/* FINAL SPECIAL MOMENT */

function showFinal(){

    const card =
    document.createElement("div");

    card.className="special";


    card.innerHTML=`

        <div class="special-heart">
            ❤️
        </div>

        <h3>
            And this is only the beginning...
        </h3>

        <p>
            So many more little moments,
            conversations and memories
            are still waiting for us. ✨
        </p>

    `;


    chat.appendChild(card);


    chat.scrollTo({

        top:chat.scrollHeight,

        behavior:"smooth"

    });


    /* LITTLE LETTER */

    setTimeout(()=>{

        const letter =
        document.createElement("div");


        letter.className="letter";


        letter.innerHTML=`

            <div class="letter-heart">
                💌
            </div>


            <div class="letter-title">
                Little Letter
            </div>


            <p>
                I don't know how many beautiful
                moments are waiting for us...
                but I know I want to experience
                every single one with you. ❤️
            </p>


            <p>
                From the smallest conversations
                to the memories we haven't made yet,
                I want to keep them all close to my heart.
                ✨
            </p>


            <p>
                This little story is just a small
                reminder of how special you are to me.
                And honestly...
                this is only our beginning. 🫶
                Don't leave me and love you lotzz,
                my lucky charm. 💜
            </p>


            <div class="letter-sign">
                — With lots of love ❤️
            </div>

        `;


        chat.appendChild(letter);


        chat.scrollTo({

            top:chat.scrollHeight,

            behavior:"smooth"

        });


        /* CONTINUE BUTTON */

        setTimeout(()=>{

            const button =
            document.createElement("button");


            button.className="next-page";


            button.innerHTML =
            "Continue Our Story → 💜";


            button.onclick = function(){

                window.location.href =
                "final.html";

            };


            chat.appendChild(button);


            chat.scrollTo({

                top:chat.scrollHeight,

                behavior:"smooth"

            });

        },800);


    },1200);

}


/* RESTART */

function restart(){

    chat.innerHTML=`

        <div class="date">

            <span>
                27 August 2025
            </span>

        </div>

    `;


    index=0;

    showMessage();

}


/* START */

window.onload=()=>{

    setTimeout(showMessage,1000);

};

</script>


</body>
</html>
